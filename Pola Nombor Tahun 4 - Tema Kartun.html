<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e8">
  <title>Pola Nombor Tahun 4</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18344b;
      --muted: #607589;
      --paper: #fffdf7;
      --blue: #3678e5;
      --blue-dark: #215ec4;
      --mint: #dff5e8;
      --green: #17784c;
      --rose: #ffebe7;
      --red: #b53b32;
      --yellow: #ffcf58;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 26px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at 18% 15%, #e0f5ff 0, transparent 31%), radial-gradient(ellipse at 90% 82%, #ffe9d5 0, transparent 30%), #fff8e8;
    }
    button { font: inherit; }
    .game { width: min(100%, 700px); }
    .topline { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 14px; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: .98rem; letter-spacing: .02em; }
    .brand-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; background: var(--yellow); box-shadow: 0 4px 0 #e9ad30; font-size: 1.3rem; }
    .class-tag { padding: 8px 13px; border: 2px solid #d9e8f3; border-radius: 999px; color: #41617c; background: #ffffffa8; font-weight: 800; font-size: .82rem; white-space: nowrap; }
    .card { position: relative; overflow: hidden; padding: clamp(23px, 6vw, 42px); border: 3px solid #fff; border-radius: 29px; background: var(--paper); box-shadow: 0 14px 40px #35536c1b, 0 5px 0 #eadfca; }
    .card::before, .card::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; pointer-events: none; }
    .card::before { width: 180px; height: 180px; right: -112px; top: 70px; border: 24px solid #eaf4ff; }
    .card::after { width: 125px; height: 125px; left: -90px; bottom: 36px; background: #fff2ce; }
    .content { position: relative; z-index: 1; }
    .heading { text-align: center; }
    .title-row { display: flex; justify-content: center; align-items: center; gap: 11px; }
    .mascot { display: grid; place-items: center; flex: 0 0 auto; width: 45px; height: 45px; border: 3px solid #fff; border-radius: 16px; background: #ffe7a6; box-shadow: 0 4px 0 #edca70; font-size: 1.65rem; transform: rotate(-6deg); }
    .title-sparkle { color: #f0b633; font-size: 1.35rem; }
    h1 { margin: 0; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.1; letter-spacing: -.04em; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 1rem; }
    .score-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 27px; }
    .score-pill { display: flex; gap: 7px; align-items: center; padding: 9px 13px; border: 2px solid #f2e8ce; border-radius: 14px; background: #fff9e8; font-weight: 900; }
    .score-pill strong { color: #bd7800; }
    .progress-wrap { flex: 1; max-width: 300px; }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: .82rem; font-weight: 800; }
    .track { height: 12px; overflow: hidden; border-radius: 99px; background: #e9f0f5; }
    .fill { height: 100%; width: 20%; border-radius: inherit; background: linear-gradient(90deg, #63c995, #32ad7d); transition: width .35s ease; }
    .question-area { margin-top: 30px; text-align: center; }
    .question-label { margin: 0 0 13px; color: #466781; font-weight: 800; font-size: 1rem; }
    .pattern { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: clamp(7px, 2vw, 13px); padding: 21px 12px; border: 2px dashed #cfdfed; border-radius: 22px; background: #f4faff; }
    .number { display: grid; place-items: center; min-width: clamp(47px, 10vw, 69px); height: clamp(53px, 11vw, 72px); padding: 0 8px; border-radius: 16px; background: white; box-shadow: 0 4px 0 #d9e6f0; font-size: clamp(1.05rem, 4.2vw, 1.55rem); font-weight: 900; }
    .number.missing { color: var(--blue); background: #e8f0ff; box-shadow: 0 4px 0 #c8d9fb; }
    .choices-title { margin: 24px 0 12px; font-size: .97rem; font-weight: 900; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .choice { min-height: 64px; border: 2px solid #d8e5ef; border-radius: 17px; color: var(--ink); background: white; box-shadow: 0 4px 0 #e4edf3; cursor: pointer; font-size: 1.35rem; font-weight: 900; transition: transform .12s, border-color .12s, background .12s; }
    .choice:hover:not(:disabled), .choice:focus-visible { transform: translateY(-2px); border-color: #85aef2; outline: 3px solid #cbdcff; outline-offset: 2px; }
    .choice:disabled { cursor: default; opacity: .8; }
    .choice.correct { color: var(--green); border-color: #71c99b; background: var(--mint); opacity: 1; }
    .choice.wrong { color: var(--red); border-color: #f2a098; background: var(--rose); opacity: 1; }
    .choice-key { display: inline-grid; place-items: center; width: 23px; height: 23px; margin-right: 6px; border-radius: 7px; color: #647c90; background: #eef3f7; font-size: .75rem; vertical-align: 3px; }
    .feedback { min-height: 75px; margin-top: 18px; padding: 12px 15px; border-radius: 16px; text-align: left; line-height: 1.45; }
    .feedback.empty { visibility: hidden; }
    .feedback.good { color: #145f3d; background: #e7f7ed; }
    .feedback.bad { color: #87352e; background: #fff0ed; }
    .feedback strong { display: block; margin-bottom: 2px; }
    .actions { display: flex; justify-content: center; margin-top: 13px; }
    .next, .replay { min-width: 200px; min-height: 54px; padding: 12px 24px; border: 0; border-radius: 16px; color: white; background: var(--blue); box-shadow: 0 5px 0 #2459b4; cursor: pointer; font-weight: 900; font-size: 1.05rem; transition: transform .12s, background .12s; }
    .next:hover, .replay:hover { transform: translateY(-2px); background: var(--blue-dark); }
    .next:focus-visible, .replay:focus-visible { outline: 4px solid #a9c7ff; outline-offset: 3px; }
    .next:disabled { display: none; }
    .result { padding: 16px 0 6px; text-align: center; }
    .result-emoji { margin-bottom: 8px; font-size: 4rem; }
    .result h2 { margin: 0; font-size: 2rem; }
    .result-score { margin: 12px 0; color: #b67600; font-size: 1.5rem; font-weight: 900; }
    .result-message { max-width: 420px; margin: 0 auto 23px; color: var(--muted); line-height: 1.6; }
    .hint { margin: 18px 0 0; color: #7890a2; text-align: center; font-size: .79rem; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      .topline { margin-bottom: 11px; }
      .brand { font-size: .85rem; }
      .brand-icon { width: 35px; height: 35px; }
      .class-tag { padding: 7px 10px; font-size: .75rem; }
      .card { border-radius: 23px; }
      .mascot { width: 37px; height: 37px; border-radius: 13px; font-size: 1.35rem; }
      .title-row { gap: 8px; }
      .score-row { margin-top: 22px; }
      .pattern { gap: 7px; padding: 17px 7px; }
      .number { min-width: 43px; padding: 0 5px; }
      .choice { min-height: 60px; font-size: 1.1rem; }
      .choice-key { margin-right: 3px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="game" aria-labelledby="title">
    <div class="topline">
      <div class="brand"><span class="brand-icon" aria-hidden="true">🔢</span><span>Kelab Matematik Cilik</span></div>
      <span class="class-tag">🌟 Tahun 4</span>
    </div>
    <section class="card">
      <div class="content">
        <header class="heading">
          <div class="title-row"><span class="mascot" aria-hidden="true">🐻</span><h1 id="title">Pola Nombor</h1><span class="title-sparkle" aria-hidden="true">✦</span></div>
          <p class="subtitle">Cari nombor yang hilang. Kamu pasti boleh! ✨</p>
        </header>
        <div id="gamePanel">
          <div class="score-row">
            <div class="score-pill" aria-label="Markah"><span aria-hidden="true">⭐</span> Markah: <strong id="score">0</strong></div>
            <div class="progress-wrap">
              <div class="progress-label"><span>Kemajuan</span><span id="progressText">Soalan 1 daripada 5</span></div>
              <div class="track" role="progressbar" aria-label="Kemajuan soalan" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1"><div class="fill" id="progressFill"></div></div>
            </div>
          </div>
          <section class="question-area" aria-labelledby="questionLabel">
            <p class="question-label" id="questionLabel">Nombor manakah yang hilang?</p>
            <div class="pattern" id="pattern" aria-label="Pola nombor"></div>
          </section>
          <p class="choices-title">Pilih jawapan yang betul:</p>
          <div class="choices" id="choices" role="group" aria-label="Pilihan jawapan"></div>
          <div class="feedback empty" id="feedback" role="status" aria-live="polite"></div>
          <div class="actions"><button class="next" id="nextButton" type="button" disabled>Soalan seterusnya <span aria-hidden="true">→</span></button></div>
          <p class="hint">Petua: tekan <b>1</b>, <b>2</b> atau <b>3</b> untuk menjawab.</p>
        </div>
        <section class="result" id="resultPanel" hidden aria-live="polite">
          <div class="result-emoji" id="resultEmoji" aria-hidden="true">🎉</div>
          <h2 id="resultTitle">Syabas!</h2>
          <p class="result-score" id="finalScore"></p>
          <p class="result-message" id="resultMessage"></p>
          <button class="replay" id="replayButton" type="button">Main lagi <span aria-hidden="true">↻</span></button>
        </section>
      </div>
    </section>
  </main>
  <script>
    const questions = [
      { numbers: [12, 17, 22, null, 32], answer: 27, step: 5, direction: 'menaik' },
      { numbers: [64, 56, null, 40, 32], answer: 48, step: 8, direction: 'menurun' },
      { numbers: [105, 115, 125, null, 145], answer: 135, step: 10, direction: 'menaik' },
      { numbers: [90, 80, 70, null, 50], answer: 60, step: 10, direction: 'menurun' },
      { numbers: [23, 30, null, 44, 51], answer: 37, step: 7, direction: 'menaik' }
    ];
    const optionSets = [[27, 26, 28], [48, 46, 50], [135, 130, 140], [60, 50, 65], [37, 36, 38]];
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    const patternEl = document.getElementById('pattern');
    const choicesEl = document.getElementById('choices');
    const feedbackEl = document.getElementById('feedback');
    const nextButton = document.getElementById('nextButton');
    const scoreEl = document.getElementById('score');
    const fillEl = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const progressBar = document.querySelector('[role="progressbar"]');

    function renderQuestion() {
      answered = false;
      const q = questions[questionIndex];
      patternEl.replaceChildren();
      q.numbers.forEach(number => {
        const tile = document.createElement('span');
        tile.className = number === null ? 'number missing' : 'number';
        tile.textContent = number === null ? '?' : number;
        if (number === null) tile.setAttribute('aria-label', 'nombor hilang');
        patternEl.append(tile);
      });
      patternEl.setAttribute('aria-label', `Pola nombor: ${q.numbers.map(n => n === null ? 'hilang' : n).join(', ')}`);
      choicesEl.replaceChildren();
      const shuffled = [...optionSets[questionIndex]].sort(() => Math.random() - 0.5);
      shuffled.forEach((value, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.dataset.answer = value;
        button.setAttribute('aria-label', `Pilihan ${index + 1}: ${value}`);
        button.innerHTML = `<span class="choice-key" aria-hidden="true">${index + 1}</span>${value}`;
        button.addEventListener('click', () => chooseAnswer(value, button));
        choicesEl.append(button);
      });
      progressText.textContent = `Soalan ${questionIndex + 1} daripada ${questions.length}`;
      fillEl.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      progressBar.setAttribute('aria-valuenow', String(questionIndex + 1));
      feedbackEl.className = 'feedback empty';
      feedbackEl.textContent = '';
      nextButton.disabled = true;
    }

    function chooseAnswer(value, selectedButton) {
      if (answered) return;
      answered = true;
      const q = questions[questionIndex];
      const correct = value === q.answer;
      if (correct) { score += 20; scoreEl.textContent = score; }
      [...choicesEl.children].forEach(button => {
        button.disabled = true;
        if (Number(button.dataset.answer) === q.answer) button.classList.add('correct');
      });
      if (!correct) selectedButton.classList.add('wrong');
      feedbackEl.className = `feedback ${correct ? 'good' : 'bad'}`;
      feedbackEl.innerHTML = `<strong>${correct ? 'Betul! Hebat! 🎉' : 'Belum tepat, cuba lagi nanti! 💪'}</strong>Polanya ${q.direction} sebanyak ${q.step}. Nombor bertambah atau berkurang ${q.step} setiap kali.`;
      nextButton.disabled = false;
      nextButton.focus();
    }

    function finishGame() {
      document.getElementById('gamePanel').hidden = true;
      document.getElementById('resultPanel').hidden = false;
      document.getElementById('finalScore').textContent = `Markah kamu: ${score} / 100`;
      const emoji = score === 100 ? '🏆' : score >= 60 ? '🎉' : '🌈';
      const title = score === 100 ? 'Hebat sekali!' : score >= 60 ? 'Syabas!' : 'Terus berusaha!';
      const message = score === 100 ? 'Kamu memang pakar pola nombor! Teruskan kecemerlangan ini.' : score >= 60 ? 'Usaha yang bagus! Kamu semakin mahir mencari pola nombor.' : 'Tidak mengapa, latihan menjadikan kita lebih mahir. Cuba sekali lagi!';
      document.getElementById('resultEmoji').textContent = emoji;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultMessage').textContent = message;
      document.getElementById('replayButton').focus();
    }

    nextButton.addEventListener('click', () => {
      if (!answered) return;
      if (questionIndex === questions.length - 1) finishGame();
      else { questionIndex++; renderQuestion(); choicesEl.querySelector('button')?.focus(); }
    });
    document.getElementById('replayButton').addEventListener('click', () => {
      questionIndex = 0; score = 0; scoreEl.textContent = '0';
      document.getElementById('resultPanel').hidden = true;
      document.getElementById('gamePanel').hidden = false;
      renderQuestion();
      choicesEl.querySelector('button')?.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
      if (document.getElementById('gamePanel').hidden) return;
      if (/^[1-3]$/.test(event.key) && !answered) choicesEl.children[Number(event.key) - 1]?.click();
      if ((event.key === 'Enter' || event.key === ' ') && answered && document.activeElement !== nextButton) nextButton.click();
    });
    renderQuestion();
  </script>
</body>
</html>
